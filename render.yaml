services:
  - type: web
    name: join-api
    runtime: node
    rootDir: backend
    buildCommand: "MONGOMS_DISABLE_POSTINSTALL=1 npm ci --include=dev && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PASSWORD_RESET_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: IMAGE_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: IMAGE_UPLOADS_ENABLED
        value: "false"
      - key: EXPO_PROJECT_ID
        sync: false
      - key: EXPO_PUSH_ENABLED
        value: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
